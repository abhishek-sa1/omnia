# Additional BSS boot parameters for stateless node provisioning.
#
# Structure:
#   common:    Applied to ALL functional groups (appended to every FG's kernel params)
#   groups:    Per-functional-group overrides (keyed by functional group name)
#
# ALLOWED keys per section:
#   params  - List of kernel command-line parameter strings
#
# PROHIBITED keys (validation will fail if present):
#   kernel, initrd, macs
#   These are platform-managed and must not be overridden by users.
#
# Merge behavior:
#   Common params are appended first, then per-FG params.
#   Platform-defined boot parameters always take precedence (prepended).

# Common BSS params applied to ALL functional groups
# Example:
#   common:
#     params:
#       - "crashkernel=auto"
#       - "hugepagesz=1G"
#       - "hugepages=16"
common: {}

# Per-functional-group BSS params overrides
# Group names must match functional groups defined in pxe_mapping_file.csv
# Example:
#   groups:
#     slurm_node_x86_64:
#       params:
#         - "intel_iommu=on"
#         - "iommu=pt"
#     login_node_x86_64:
#       params:
#         - "transparent_hugepage=never"
groups: {}
