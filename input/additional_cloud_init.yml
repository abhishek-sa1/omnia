# Additional cloud-init configuration for stateless node provisioning.
#
# Structure:
#   common:  Applied to ALL functional groups (all nodes).
#            Injected in the pre phase (before platform FG content).
#            Does NOT support pre/post — it is always pre.
#   pre:     Per-functional-group content injected BEFORE platform FG content.
#            Keyed by functional group name.
#   post:    Per-functional-group content injected AFTER platform FG content.
#            Keyed by functional group name.
#
# ALLOWED keys per section:
#   write_files  - Write files to nodes (list of file entries)
#   packages     - Install additional packages (list of package names)
#   runcmd       - Run commands at final stage (list of commands)
#
# PROHIBITED keys (validation will fail if present):
#   bootcmd, network, network-config
#   These are platform-managed and must not be overridden by users.
#
# Ordering guarantee:
#   Common content is injected BEFORE platform FG content (pre phase).
#   Pre per-FG content is injected after common, still before platform.
#   Post per-FG content is injected AFTER platform FG content.
#   All content is embedded in the FG cloud-init document, so ordering is
#   deterministic regardless of OpenCHAMI group merge order.
#
# Example:
#   common:
#     write_files:
#       - path: /etc/motd
#         content: "Welcome to the HPC cluster\n"
#         permissions: '0644'
#     packages:
#       - htop
#       - vim
#     runcmd:
#       - echo "Common setup (all nodes)" >> /var/log/custom_setup.log
#   pre:
#     slurm_node_x86_64:
#       runcmd:
#         - echo "Pre-slurm setup" >> /var/log/custom_setup.log
#   post:
#     slurm_node_x86_64:
#       runcmd:
#         - echo "Post-slurm cleanup" >> /var/log/custom_setup.log

# Common cloud-init applied to all functional groups (pre phase)
common: {}

# Per-FG content injected BEFORE platform FG content
pre: {}

# Per-FG content injected AFTER platform FG content
post: {}
