---
# Loads user-provided additional BSS boot parameters config and sets facts for
# configure_bss_group.yml to append custom kernel params.
# Input validation (prohibited keys, allowed keys, types, FG names) is
# performed earlier in the L2 validation flow (provision_validation.py).
# This file only parses the YAML and sets enabled/data facts.

- name: Read additional_bss_params_config_file path
  ansible.builtin.set_fact:
    additional_bss_params_file_path: >-
      {{ hostvars['localhost']['additional_bss_params_config_file'] | default('') | trim }}

- name: Set defaults when additional BSS params is disabled
  ansible.builtin.set_fact:
    additional_bss_params_enabled: false
    additional_bss_params_common_enabled: false
    additional_bss_params_groups_enabled: false
    additional_bss_params_common_data: {}
    additional_bss_params_groups_data: {}
  when: additional_bss_params_file_path == ''

- name: Load additional BSS params config
  when: additional_bss_params_file_path != ''
  block:
    - name: Set OIM-local path for additional BSS params config
      ansible.builtin.set_fact:
        additional_bss_params_oim_path: "{{ bss_dir }}/additional_bss_params.yml"

    - name: Copy additional BSS params config file to OIM workdir
      ansible.builtin.copy:
        src: "{{ additional_bss_params_file_path }}"
        dest: "{{ additional_bss_params_oim_path }}"
        mode: "{{ hostvars['localhost']['file_permissions_644'] }}"

    - name: Load additional BSS params config file
      ansible.builtin.slurp:
        src: "{{ additional_bss_params_oim_path }}"
      register: _abss_file_content

    - name: Parse additional BSS params config YAML
      ansible.builtin.set_fact:
        _abss_config: "{{ _abss_file_content.content | b64decode | from_yaml | default({}) }}"

    - name: Extract common and groups data
      ansible.builtin.set_fact:
        additional_bss_params_common_data: "{{ _abss_config.common | default({}) }}"
        additional_bss_params_groups_data: "{{ _abss_config.groups | default({}) }}"

    - name: Set enabled flags
      ansible.builtin.set_fact:
        additional_bss_params_common_enabled: "{{ additional_bss_params_common_data | length > 0 }}"
        additional_bss_params_groups_enabled: "{{ additional_bss_params_groups_data | length > 0 }}"
        additional_bss_params_enabled: >-
          {{ (additional_bss_params_common_data | length > 0) or
             (additional_bss_params_groups_data | length > 0) }}

    - name: Log additional BSS params load result
      ansible.builtin.debug:
        msg: >-
          additional_bss_params loaded.
          File: {{ additional_bss_params_oim_path }}.
          Common enabled: {{ additional_bss_params_common_enabled }}.
          Groups enabled: {{ additional_bss_params_groups_enabled }}.
